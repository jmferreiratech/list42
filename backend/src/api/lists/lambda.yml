functions:
  api-lists:
    handler: src/api/lists/lambda.handler
    events:
      - http:
          path: 'api/lists'
          method: ANY
          cors:
            origin: ${self:provider.environment.ORIGINS}
            allowCredentials: true
      - http:
          path: 'api/lists/{proxy+}'
          method: ANY
          cors:
            origin: ${self:provider.environment.ORIGINS}
            allowCredentials: true
