resources:
  Resources:
    GroceryListsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: grocery_lists
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          -
            AttributeName: id
            AttributeType: S
        KeySchema:
          -
            AttributeName: id
            KeyType: HASH
        # Every change to a list goes through this stream to the people who have it open (src/api/updates).
        StreamSpecification:
          StreamViewType: NEW_IMAGE
